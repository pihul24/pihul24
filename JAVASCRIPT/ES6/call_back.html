<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Call back:-Creating a function inside another function and when we call a function we call prevous one too  -->
</head>
<body>
    <script>
        function getData(dataid,getNextData)
        {
            setTimeout(()=>{
                console.log("data", dataid);
                if(getNextData)
            {
                getNextData();
            }

            },2000);

        }
        getData(1,()=>{
            getData(2,()=>{
                getData(3,()=>{
                    getData(4);
                })
            })
        });
        

        

    </script>
</body>
</html>
