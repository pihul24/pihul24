<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Call back:-Creating a function inside another function and when we call a function we call prevous one too  -->
</head>
<body>
    <script>
        function sum(a,b)
        {
            console.log(a+b);
        }
        function cal(a,b,sumcallback)
        {
            sumcallback(a,b);

        }
        cal(10,20,sum);

    </script>
</body>
</html>
